# Builds the Windows app and commits it to release-raw/, so testers only need to
# get the latest repo and run release-raw/appCamera-UI.exe. Nobody needs Windows or Qt to build.
name: Build Windows app

on:
  push:
    paths:
      - 'Camera-UI/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:   # "Run workflow" button on the Actions tab

permissions:
  contents: write      # to commit release-raw/ back to the branch

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same Qt and compiler as the original release-raw.zip
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtserialport'
          tools: 'tools_mingw1120,qt.tools.win64_mingw1120'
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $mingw = "$env:IQTA_TOOLS/mingw1120_64/bin"
          # Qt's MinGW first, so the build and windeployqt use it rather than the runner's own GCC
          $env:PATH = "$mingw;$env:QT_ROOT_DIR/bin;$env:PATH"
          cmake -S Camera-UI -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_C_COMPILER="$mingw/gcc.exe" -DCMAKE_CXX_COMPILER="$mingw/g++.exe"
          cmake --build build -j 4

      - name: Package into release-raw/
        shell: pwsh
        run: |
          $env:PATH = "$env:IQTA_TOOLS/mingw1120_64/bin;$env:QT_ROOT_DIR/bin;$env:PATH"
          if (Test-Path release-raw) { Remove-Item release-raw -Recurse -Force }
          New-Item -ItemType Directory release-raw | Out-Null
          Copy-Item build/appCamera-UI.exe release-raw/
          # No --release: it fails with "Unable to find the platform plugin" on MinGW builds
          windeployqt --qmldir Camera-UI release-raw/appCamera-UI.exe
          if (!(Test-Path release-raw/platforms/qwindows.dll)) { throw "windeployqt did not deploy the platform plugin" }

      - name: Commit release-raw/
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f release-raw
          if git diff --cached --quiet; then
            echo "release-raw/ unchanged"
            exit 0
          fi
          git commit -m "Rebuild release-raw/ for ${GITHUB_SHA::7}"
          # Someone may have pushed while this was building
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
